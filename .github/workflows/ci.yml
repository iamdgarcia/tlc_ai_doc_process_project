name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Hermetic: the suite seeds its own in-memory DB and mocks the external
        # APIs (no SCANEAME_API_KEY / OPENAI_API_KEY needed).
        run: python -m pytest tests/ -q
